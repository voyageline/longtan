<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>校园匿名论坛</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:20px;
    font-family:"Microsoft YaHei",Arial;
    background:#f3f3f3;
}


h1{
    text-align:center;
}


textarea{
    width:100%;
    height:120px;
    padding:10px;
    box-sizing:border-box;
}


button{
    padding:8px 15px;
    margin-top:8px;
    cursor:pointer;
}


.post{

    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:10px;

}


.delete{

    background:#ff4d4f;
    color:white;
    border:0;
    float:right;

}


.time{

    color:#888;
    font-size:12px;

}


</style>

</head>



<body>


<h1>校园匿名论坛</h1>


<textarea id="content"
placeholder="请输入内容..."></textarea>


<br>


<button onclick="sendPost()">
发布
</button>



<h2>最新帖子</h2>


<div id="posts">
加载中...
</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://qxnjtuyxfzlpdopplidj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_kpHZAYVxYGiKzbOH5kvOOA_C_vbnIGH";



const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// ===== 用户身份 =====


let user_id =
localStorage.getItem("forum_user_id");


if(!user_id){

user_id =
crypto.randomUUID();

localStorage.setItem(
"forum_user_id",
user_id
);

}



// ===== 管理员 =====

// 以后可以修改
const ADMIN_PASSWORD =
"admin123";





async function loadPosts(){


let {data,error}=await db
.from("posts")
.select("*")
.order(
"id",
{ascending:false}
);



if(error){

document.getElementById("posts").innerHTML=
error.message;

return;

}



let html="";


data.forEach(post=>{


let canDelete =
post.user_id===user_id;



html += `


<div class="post">


<button
class="delete"
style="display:${canDelete?"block":"none"}"
onclick="deletePost(${post.id})">

删除

</button>



<b>${post.nickname}</b>


<p>

${escapeHTML(post.content)}

</p>


<div class="time">

${post.created_at}

</div>


</div>


`;



});



document.getElementById("posts")
.innerHTML =
html || "暂无帖子";


}





async function sendPost(){


let content =
document.getElementById("content")
.value
.trim();



if(!content){

alert("请输入内容");

return;

}



let nickname =
"匿名用户"
+
Math.floor(
Math.random()*9000+1000
);



let {error}=await db
.from("posts")
.insert({

nickname:nickname,

content:content,

user_id:user_id

});



if(error){

alert(error.message);

return;

}



document.getElementById("content")
.value="";


loadPosts();


}






async function deletePost(id){



if(!confirm("确定删除？"))

return;



let {error}=await db
.from("posts")
.delete()
.eq("id",id)
.eq("user_id",user_id);



if(error){

alert(error.message);

}



loadPosts();


}




function escapeHTML(str){

return str
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}



loadPosts();



</script>


</body>

</html>
