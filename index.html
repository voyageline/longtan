<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>虎台中学匿名论坛</title>


<style>

body{
max-width:800px;
margin:auto;
padding:20px;
font-family:"Microsoft YaHei",Arial;
background:#f5f5f5;
}


h1{
text-align:center;
}


.notice{
background:#fff7e6;
border:1px solid #ffd591;
padding:12px;
border-radius:8px;
font-size:14px;
color:#666;
margin-bottom:15px;
}


textarea{
width:100%;
height:120px;
padding:10px;
box-sizing:border-box;
}


input{
padding:8px;
width:70%;
}


button{
padding:8px 15px;
cursor:pointer;
border:0;
border-radius:6px;
}


.send{
background:#1677ff;
color:white;
}


.replybtn{
background:#52c41a;
color:white;
}


.post{

background:white;
padding:15px;
margin-top:15px;
border-radius:10px;

}


.reply{

background:#f8f8f8;
padding:8px;
margin-top:8px;
border-radius:6px;

}


.time{

font-size:12px;
color:#888;

}


</style>


</head>



<body>



<h1>虎台中学匿名论坛</h1>



<div class="notice">

<p>

<b>免责声明：</b><br>

本论坛为校园匿名交流平台，仅供学生交流和表达个人观点使用。<br>

用户发布的内容仅代表发布者个人观点，不代表本站立场。<br>

请勿发布违法信息、侵犯他人隐私、造谣诽谤、辱骂攻击等内容。<br>

用户应对自己发布的信息承担相应责任。<br>

管理员有权删除违反规则的内容。

</p>

</div>



<textarea id="content"
placeholder="请输入内容..."></textarea>


<br>


<button class="send" onclick="sendPost()">

发布

</button>



<h2>最新帖子</h2>


<div id="posts">

加载中...

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


const SUPABASE_URL =
"https://qxnjtuyxfzlpdopplidj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_kpHZAYVxYGiKzbOH5kvOOA_C_vbnIGH";



const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function loadPosts(){


let {data,error}=await db

.from("posts")

.select("*")

.order("id",{ascending:false})

.limit(50);



if(error){

document.getElementById("posts").innerHTML=
error.message;

return;

}



let html="";



data.forEach(post=>{


html += `


<div class="post">


<b>

${safe(post.nickname)}

</b>


<p>

${safe(post.content)}

</p>


<div class="time">

${post.created_at || ""}

</div>



<div id="reply-${post.id}">

加载回复中...

</div>



<input

id="input-${post.id}"

placeholder="回复">


<button class="replybtn"

onclick="sendReply(${post.id})">

回复

</button>



</div>


`;


});



document.getElementById("posts").innerHTML =

html || "暂无帖子";



data.forEach(post=>{

loadReplies(post.id);

});


}





async function sendPost(){


let text =
document.getElementById("content")
.value
.trim();



if(!text){

alert("请输入内容");

return;

}



let nickname =

"匿名用户" +

Math.floor(

Math.random()*9000+1000

);



let res = await fetch("/api/post",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

nickname:nickname,

content:text

})

});



if(!res.ok){

alert(await res.text());

return;

}



document.getElementById("content").value="";



await new Promise(resolve =>

setTimeout(resolve,1000)

);



await loadPosts();


}








async function loadReplies(post_id){


let {data,error}=await db

.from("replies")

.select("*")

.eq("post_id",post_id)

.order("id",{ascending:true});



if(error){

return;

}



let html="";



data.forEach(r=>{


html += `


<div class="reply">


<b>

${safe(r.nickname)}

</b>


：

${safe(r.content)}



</div>


`;


});



let box =
document.getElementById(
"reply-"+post_id
);



if(box){

box.innerHTML =
html || "暂无回复";

}


}







async function sendReply(post_id){


let input =

document.getElementById(
"input-"+post_id
);



let text =
input.value.trim();



if(!text){

return;

}



let nickname =

"匿名用户" +

Math.floor(

Math.random()*9000+1000

);



let res = await fetch("/api/reply",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

post_id:post_id,

nickname:nickname,

content:text

})

});



if(!res.ok){

alert(await res.text());

return;

}



input.value="";



await loadReplies(post_id);


}








function safe(str){


return String(str)

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");


}







loadPosts();



</script>



</body>

</html>
