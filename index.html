<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>校园匿名论坛</title>
<div class="notice">
<p>
<b>免责声明：</b>
本论坛为校园匿名交流平台，仅供学生交流和表达个人观点使用。
用户发布的内容仅代表发布者个人观点，不代表本站立场。
请勿发布违法信息、侵犯他人隐私、造谣诽谤、辱骂攻击等内容。
用户应对自己发布的信息承担相应责任。
管理员有权删除违反规则的内容。
</p>
</div>
<style>

body{
max-width:800px;
margin:auto;
padding:20px;
font-family:"Microsoft YaHei",Arial;
background:#f5f5f5;
}

h1{
text-align:center;
}

textarea{
width:100%;
height:120px;
padding:10px;
box-sizing:border-box;
}

input{
padding:8px;
width:70%;
}

button{
padding:8px 15px;
cursor:pointer;
border:0;
border-radius:6px;
}

.send{
background:#1677ff;
color:white;
}

.delete{
background:#ff4d4f;
color:white;
float:right;
}

.replybtn{
background:#52c41a;
color:white;
}

.post{

background:white;
padding:15px;
margin-top:15px;
border-radius:10px;

}

.reply{

background:#f8f8f8;
padding:8px;
margin-top:8px;
border-radius:6px;

}

.time{

font-size:12px;
color:#888;

}

</style>

</head>


<body>


<h1>校园匿名论坛</h1>


<textarea id="content"
placeholder="请输入内容..."></textarea>


<br>

<button class="send" onclick="sendPost()">
发布
</button>



<h2>最新帖子</h2>


<div id="posts">
加载中...
</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://qxnjtuyxfzlpdopplidj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_kpHZAYVxYGiKzbOH5kvOOA_C_vbnIGH";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// 加载帖子

async function loadPosts(){


let {data,error}=await db
.from("posts")
.select("*")
.order("id",{ascending:false})
.limit(50);



if(error){

posts.innerHTML=error.message;

return;

}



let html="";


data.forEach(post=>{


html+=`

<div class="post">


<button class="delete"
onclick="deletePost(${post.id})">
删除
</button>


<b>
${safe(post.nickname)}
</b>


<p>
${safe(post.content)}
</p>


<div class="time">
${post.created_at}
</div>



<div id="reply-${post.id}">
加载回复...
</div>


<input 
id="input-${post.id}"
placeholder="回复">


<button class="replybtn"
onclick="sendReply(${post.id})">

回复

</button>



</div>

`;



});


document.getElementById("posts")
.innerHTML=html || "暂无帖子";



data.forEach(post=>{

loadReplies(post.id);

});


}





// 发布帖子

async function sendPost(){


let text =
content.value.trim();



if(!text){

alert("请输入内容");

return;

}


let nickname=
"匿名用户"+
Math.floor(
Math.random()*9000+1000
);



let {error}=await db
.from("posts")
.insert({

nickname:nickname,

content:text

});



if(error){

alert(error.message);

return;

}


content.value="";


loadPosts();


}





// 加载回复

async function loadReplies(post_id){


let {data,error}=await db
.from("replies")
.select("*")
.eq("post_id",post_id)
.order("id");



if(error)return;



let html="";


data.forEach(r=>{


html+=`

<div class="reply">

<b>${safe(r.nickname)}</b>

：

${safe(r.content)}

</div>

`;



});



document.getElementById(
"reply-"+post_id
).innerHTML=
html || "暂无回复";

}




// 发布回复

async function sendReply(post_id){


let input =
document.getElementById(
"input-"+post_id
);


let text =
input.value.trim();



if(!text)return;



let nickname=
"匿名用户"+
Math.floor(
Math.random()*9000+1000
);



let {error}=await db
.from("replies")
.insert({

post_id:post_id,

nickname:nickname,

content:text

});



if(error){

alert(error.message);

return;

}



input.value="";


loadReplies(post_id);


}





// 删除帖子

async function deletePost(id){


if(!confirm("确定删除？"))
return;



let {error}=await db
.from("posts")
.delete()
.eq("id",id);



if(error){

alert(error.message);

return;

}



loadPosts();


}





function safe(str){

return String(str)
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}



loadPosts();


</script>


</body>

</html>
