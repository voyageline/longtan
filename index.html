<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>校园匿名论坛</title>

<style>

body{
    max-width:800px;
    margin:auto;
    padding:20px;
    font-family:"Microsoft YaHei",Arial;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

.send{
    background:#1677ff;
    color:white;
}

.delete{
    float:right;
    background:#ff4d4f;
    color:white;
}

.post{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

.time{
    color:#888;
    font-size:12px;
}

</style>

</head>


<body>


<h1>校园匿名论坛</h1>


<textarea id="content"
placeholder="说点什么..."></textarea>


<br>


<button class="send" onclick="sendPost()">
发布
</button>



<h2>最新帖子</h2>


<div id="posts">
加载中...
</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://qxnjtuyxfzlpdopplidj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_kpHZAYVxYGiKzbOH5kvOOA_C_vbnIGH";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



// 加载帖子

async function loadPosts(){


let {data,error}=await db
.from("posts")
.select("*")
.order("id",{ascending:false})
.limit(50);



if(error){

document.getElementById("posts").innerHTML =
"加载失败："+error.message;

return;

}



let html="";


data.forEach(post=>{


html += `

<div class="post">


<button class="delete"
onclick="deletePost(${post.id})">
删除
</button>


<b>${post.nickname}</b>


<p>
${safe(post.content)}
</p>


<div class="time">
${post.created_at}
</div>


</div>

`;

});


document.getElementById("posts").innerHTML =
html || "暂无帖子";


}




// 发布帖子

async function sendPost(){


let text =
document.getElementById("content")
.value
.trim();



if(!text){

alert("请输入内容");

return;

}



let nickname =
"匿名用户"+
Math.floor(Math.random()*9000+1000);



let {error}=await db
.from("posts")
.insert({

nickname:nickname,

content:text

});



if(error){

alert("发布失败："+error.message);

return;

}



document.getElementById("content")
.value="";


loadPosts();


}




// 删除帖子

async function deletePost(id){


if(!confirm("确定删除？"))
return;



let {error}=await db
.from("posts")
.delete()
.eq("id",id);



if(error){

alert("删除失败："+error.message);

return;

}


loadPosts();


}




// 防止HTML注入

function safe(str){

return str
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}




loadPosts();


</script>


</body>

</html>
